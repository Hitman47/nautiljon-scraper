name: Publish Docker image

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY}"
          echo "IMAGE_NAME=${image_name,,}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "CHANNEL_TAG=latest" >> "$GITHUB_ENV"
          else
            echo "CHANNEL_TAG=test" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CHANNEL_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test Chromium in published image
        run: |
          docker pull "${IMAGE_NAME}:${GITHUB_SHA}"
          docker run --rm "${IMAGE_NAME}:${GITHUB_SHA}" browser-smoke
