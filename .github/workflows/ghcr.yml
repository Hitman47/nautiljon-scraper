name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source and deployment files
        run: |
          python -m compileall -q scraper_nautiljon.py test_scraper_nautiljon.py
          python scraper_nautiljon.py selftest
          bash -n docker-entrypoint.sh
          docker compose -f portainer-stack.yml config --quiet
          NAUTILJON_NORDVPN_WIREGUARD_PRIVATE_KEY=dummy \
            docker compose -f compose.gluetun-nautiljon.example.yml config --quiet

      - name: Run tests
        run: python -m unittest -v

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY}"
          echo "IMAGE_NAME=${image_name,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: nautiljon-scraper:ci
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Smoke test Chromium before publication
        run: docker run --rm nautiljon-scraper:ci browser-smoke

      - name: Publish validated image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
