services:
  gluetun-nautiljon:
    image: "${NAUTILJON_GLUETUN_IMAGE:-qmcgaw/gluetun:latest}"
    container_name: Gluetun-Nautiljon_WG
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: "${NAUTILJON_NORDVPN_WIREGUARD_PRIVATE_KEY:?Renseigner la cle WireGuard NordVPN}"
      SERVER_COUNTRIES: "${NAUTILJON_NORDVPN_COUNTRIES:-Netherlands}"
      HTTPPROXY: "on"
      HTTPPROXY_STEALTH: "on"
      HTTPPROXY_LOG: "off"
      HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: >-
        {"auth":"apikey","apikey":"${GLUETUN_CONTROL_API_KEY:?Renseigner une cle API locale Gluetun}"}
      TZ: "${TZ:-Europe/Paris}"
    volumes:
      - "${NAUTILJON_HOST_GLUETUN:-/media/nvme0n1p1/AppData/Gluetun-Nautiljon}:/gluetun"
    networks:
      torrent_vpn_share:
        aliases:
          - gluetun-nautiljon
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    cpus: "${NAUTILJON_GLUETUN_CPUS:-0.50}"
    mem_limit: "${NAUTILJON_GLUETUN_MEM_LIMIT:-256m}"
    memswap_limit: "${NAUTILJON_GLUETUN_MEM_LIMIT:-256m}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  nautiljon:
    image: "${NAUTILJON_IMAGE:-ghcr.io/hitman47/nautiljon-scraper:latest}"
    container_name: nautiljon-scraper
    network_mode: "service:gluetun-nautiljon"
    depends_on:
      gluetun-nautiljon:
        condition: service_healthy
        restart: true
    command: ["${NAUTILJON_COMMAND:-monthly}"]
    environment:
      NAUTILJON_OUT_DIR: /data/output
      NAUTILJON_BACKEND: "${NAUTILJON_BACKEND:-flaresolverr}"
      NAUTILJON_BROWSER_HEADLESS: "${NAUTILJON_BROWSER_HEADLESS:-false}"
      NAUTILJON_BROWSER_ATTACH: "${NAUTILJON_BROWSER_ATTACH:-false}"
      NAUTILJON_BROWSER_PROFILE: /data/browser-profile
      NAUTILJON_CHROME_BINARY: /usr/bin/chromium
      NAUTILJON_CHROMEDRIVER: /usr/bin/chromedriver
      NAUTILJON_CLOUDFLARE_WAIT_SECONDS: "${NAUTILJON_CLOUDFLARE_WAIT_SECONDS:-120}"
      NAUTILJON_FLARESOLVERR_URL: "${NAUTILJON_FLARESOLVERR_URL:-http://flaresolverr:8191/v1}"
      NAUTILJON_FLARESOLVERR_PROXY_URL: "http://gluetun-nautiljon:8888"
      NAUTILJON_FLARESOLVERR_PROXY_USERNAME: ""
      NAUTILJON_FLARESOLVERR_PROXY_PASSWORD: ""
      NAUTILJON_FLARESOLVERR_TIMEOUT_MS: "${NAUTILJON_FLARESOLVERR_TIMEOUT_MS:-120000}"
      NAUTILJON_FLARESOLVERR_STARTUP_ATTEMPTS: "${NAUTILJON_FLARESOLVERR_STARTUP_ATTEMPTS:-30}"
      NAUTILJON_FLARESOLVERR_STARTUP_DELAY: "${NAUTILJON_FLARESOLVERR_STARTUP_DELAY:-2}"
      NAUTILJON_DELAY: "${NAUTILJON_DELAY:-4.0}"
      NAUTILJON_DELAY_MIN: "${NAUTILJON_DELAY_MIN:-4.0}"
      NAUTILJON_DELAY_MAX: "${NAUTILJON_DELAY_MAX:-7.0}"
      NAUTILJON_BATCH_SIZE: "${NAUTILJON_BATCH_SIZE:-80}"
      NAUTILJON_BATCH_PAUSE_MIN: "${NAUTILJON_BATCH_PAUSE_MIN:-45}"
      NAUTILJON_BATCH_PAUSE_MAX: "${NAUTILJON_BATCH_PAUSE_MAX:-90}"
      NAUTILJON_REQUEST_BURST_SIZE: "${NAUTILJON_REQUEST_BURST_SIZE:-20}"
      NAUTILJON_REQUEST_BURST_PAUSE_MIN: "${NAUTILJON_REQUEST_BURST_PAUSE_MIN:-120}"
      NAUTILJON_REQUEST_BURST_PAUSE_MAX: "${NAUTILJON_REQUEST_BURST_PAUSE_MAX:-240}"
      NAUTILJON_DETAIL_DELAY_MIN: "${NAUTILJON_DETAIL_DELAY_MIN:-10}"
      NAUTILJON_DETAIL_DELAY_MAX: "${NAUTILJON_DETAIL_DELAY_MAX:-15}"
      NAUTILJON_DETAIL_BATCH_SIZE: "${NAUTILJON_DETAIL_BATCH_SIZE:-15}"
      NAUTILJON_DETAIL_BATCH_PAUSE_MIN: "${NAUTILJON_DETAIL_BATCH_PAUSE_MIN:-45}"
      NAUTILJON_DETAIL_BATCH_PAUSE_MAX: "${NAUTILJON_DETAIL_BATCH_PAUSE_MAX:-75}"
      NAUTILJON_DETAIL_MODE: "${NAUTILJON_DETAIL_MODE:-deferred}"
      NAUTILJON_QUEUE_RELEASE_REFRESH: "${NAUTILJON_QUEUE_RELEASE_REFRESH:-false}"
      NAUTILJON_ENRICH_MAX_ITEMS: "${NAUTILJON_ENRICH_MAX_ITEMS:-12}"
      NAUTILJON_ENRICH_HARD_LIMIT: "${NAUTILJON_ENRICH_HARD_LIMIT:-12}"
      NAUTILJON_ENRICH_MIN_INTERVAL_MINUTES: "${NAUTILJON_ENRICH_MIN_INTERVAL_MINUTES:-30}"
      NAUTILJON_MONTHLY_RETRY_MINUTES: "${NAUTILJON_MONTHLY_RETRY_MINUTES:-15}"
      NAUTILJON_MONTHLY_PHASE_PAUSE_MINUTES: "${NAUTILJON_MONTHLY_PHASE_PAUSE_MINUTES:-10}"
      NAUTILJON_MONTHLY_MAX_HOURS: "${NAUTILJON_MONTHLY_MAX_HOURS:-72}"
      NAUTILJON_LETTER_PAUSE_MIN: "${NAUTILJON_LETTER_PAUSE_MIN:-20}"
      NAUTILJON_LETTER_PAUSE_MAX: "${NAUTILJON_LETTER_PAUSE_MAX:-45}"
      NAUTILJON_FAILURE_PAUSE_MIN: "${NAUTILJON_FAILURE_PAUSE_MIN:-120}"
      NAUTILJON_FAILURE_PAUSE_MAX: "${NAUTILJON_FAILURE_PAUSE_MAX:-300}"
      NAUTILJON_BLOCK_RECOVERY_ATTEMPTS: "${NAUTILJON_BLOCK_RECOVERY_ATTEMPTS:-1}"
      NAUTILJON_BLOCK_RECOVERY_PAUSE_MIN: "${NAUTILJON_BLOCK_RECOVERY_PAUSE_MIN:-60}"
      NAUTILJON_BLOCK_RECOVERY_PAUSE_MAX: "${NAUTILJON_BLOCK_RECOVERY_PAUSE_MAX:-120}"
      NAUTILJON_BLOCK_COOLDOWN_HOURS: "${NAUTILJON_BLOCK_COOLDOWN_HOURS:-24}"
      NAUTILJON_GLUETUN_AUTO_ROTATE: "${NAUTILJON_GLUETUN_AUTO_ROTATE:-false}"
      NAUTILJON_GLUETUN_CONTROL_URL: "http://127.0.0.1:8000"
      NAUTILJON_GLUETUN_CONTROL_API_KEY: "${GLUETUN_CONTROL_API_KEY:-}"
      NAUTILJON_GLUETUN_CONTROL_USERNAME: "${NAUTILJON_GLUETUN_CONTROL_USERNAME:-}"
      NAUTILJON_GLUETUN_CONTROL_PASSWORD: "${NAUTILJON_GLUETUN_CONTROL_PASSWORD:-}"
      NAUTILJON_GLUETUN_ROTATE_MIN_INTERVAL_MINUTES: "${NAUTILJON_GLUETUN_ROTATE_MIN_INTERVAL_MINUTES:-60}"
      NAUTILJON_GLUETUN_ROTATE_STOP_SECONDS: "${NAUTILJON_GLUETUN_ROTATE_STOP_SECONDS:-3}"
      NAUTILJON_GLUETUN_ROTATE_TIMEOUT_SECONDS: "${NAUTILJON_GLUETUN_ROTATE_TIMEOUT_SECONDS:-120}"
      NAUTILJON_PAGE_FAILURE_RETRIES: "${NAUTILJON_PAGE_FAILURE_RETRIES:-1}"
      NAUTILJON_ABORT_AFTER_DETAIL_FAILURES: "${NAUTILJON_ABORT_AFTER_DETAIL_FAILURES:-2}"
      NAUTILJON_RESUME: "${NAUTILJON_RESUME:-true}"
      NAUTILJON_FLUSH_EVERY: "${NAUTILJON_FLUSH_EVERY:-25}"
      NAUTILJON_MIN_DAYS_BETWEEN_DIFF_EXPORTS: "${NAUTILJON_MIN_DAYS_BETWEEN_DIFF_EXPORTS:-30}"
      NAUTILJON_ABORT_AFTER_LISTING_FAILURES: "${NAUTILJON_ABORT_AFTER_LISTING_FAILURES:-1}"
      NAUTILJON_RSS_FEEDS: "${NAUTILJON_RSS_FEEDS:-http://feeds.feedburner.com/nautiljon/NdFI}"
      NAUTILJON_MERGE_RSS_CANDIDATES: "${NAUTILJON_MERGE_RSS_CANDIDATES:-false}"
      NAUTILJON_DIAGNOSE_LETTER: "${NAUTILJON_DIAGNOSE_LETTER:-a}"
      NAUTILJON_DIAGNOSE_DETAIL_URL: "${NAUTILJON_DIAGNOSE_DETAIL_URL:-https://www.nautiljon.com/mangas/one+piece.html}"
      NAUTILJON_FORCE_SCRAPE: "${NAUTILJON_FORCE_SCRAPE:-false}"
      NAUTILJON_REFRESH_STALE_DAYS: "${NAUTILJON_REFRESH_STALE_DAYS:-30}"
      NAUTILJON_DROP_MISSING: "${NAUTILJON_DROP_MISSING:-true}"
      NAUTILJON_MAX_MISSING_RATIO: "${NAUTILJON_MAX_MISSING_RATIO:-0.15}"
      NAUTILJON_MAX_CONFIRMED_MISSING_RATIO: "${NAUTILJON_MAX_CONFIRMED_MISSING_RATIO:-0.35}"
      NAUTILJON_COVERAGE_CONFIRMATION_MIN_SECONDS: "${NAUTILJON_COVERAGE_CONFIRMATION_MIN_SECONDS:-3600}"
      NAUTILJON_LETTERS: "${NAUTILJON_LETTERS:-}"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - "${NAUTILJON_HOST_OUTPUT:-/media/nvme0n1p1/AppData/NautiljonScraper/output}:/data/output"
      - "${NAUTILJON_HOST_BROWSER_PROFILE:-/media/nvme0n1p1/AppData/NautiljonScraper/browser-profile}:/data/browser-profile"
    cpus: "${NAUTILJON_CPUS:-0.50}"
    cpu_shares: 256
    mem_limit: "${NAUTILJON_MEM_LIMIT:-768m}"
    memswap_limit: "${NAUTILJON_MEMSWAP_LIMIT:-768m}"
    shm_size: "${NAUTILJON_SHM_SIZE:-256m}"
    pids_limit: 256
    restart: "no"

networks:
  torrent_vpn_share:
    external: true
